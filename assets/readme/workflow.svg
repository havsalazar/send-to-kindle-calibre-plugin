<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="272" viewBox="0 0 1200 272"
     role="img" aria-labelledby="wf-title wf-desc">
  <title id="wf-title">What happens to each selected book</title>
  <desc id="wf-desc">Four steps, in order: pick the first available format from the preferred list; convert it to EPUB when it is a PDF and add the EPUB back to the book; run StkSendToHandler.exe on the file and check its exit code; write the outcome to the stk_sent and stk_error columns.</desc>

  <rect width="1200" height="272" rx="22" fill="#14161A"/>

  <text x="48" y="46" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
        font-size="17" letter-spacing="1.8" fill="#7B8590">FOR EACH SELECTED BOOK · BACKGROUND JOB</text>

  <g transform="translate(48 72)">
    <rect width="249" height="160" rx="14" fill="#1B1E23" stroke="#282D34"/>
    <text x="22" y="36" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" fill="#F4A63A">01</text>
    <text x="22" y="66" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="23" font-weight="600" fill="#F4F6F8">Pick a format</text>
    <text x="22" y="98" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="19" fill="#B7BFC8">the first one the book</text>
    <text x="22" y="121" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="19" fill="#B7BFC8">has from your</text>
    <text x="22" y="144" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="19" fill="#B7BFC8">preferred list</text>
  </g>

  <g transform="translate(333 72)">
    <rect width="249" height="160" rx="14" fill="#1B1E23" stroke="#282D34"/>
    <text x="22" y="36" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" fill="#F4A63A">02</text>
    <text x="22" y="66" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="23" font-weight="600" fill="#F4F6F8">Convert a PDF</text>
    <text x="22" y="98" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="19" fill="#B7BFC8">to EPUB, kept on the</text>
    <text x="22" y="121" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="19" fill="#B7BFC8">book so a second</text>
    <text x="22" y="144" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="19" fill="#B7BFC8">send is instant</text>
  </g>

  <g transform="translate(618 72)">
    <rect width="249" height="160" rx="14" fill="#1B1E23" stroke="#282D34"/>
    <text x="22" y="36" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" fill="#F4A63A">03</text>
    <text x="22" y="66" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="23" font-weight="600" fill="#F4F6F8">Hand it over</text>
    <text x="22" y="98" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" fill="#E8E1D3">StkSendToHandler</text>
    <text x="22" y="121" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="19" fill="#B7BFC8">runs on the file; its</text>
    <text x="22" y="144" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="19" fill="#B7BFC8">exit code decides</text>
  </g>

  <g transform="translate(903 72)">
    <rect width="249" height="160" rx="14" fill="#1B1E23" stroke="#282D34"/>
    <text x="22" y="36" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" fill="#F4A63A">04</text>
    <text x="22" y="66" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="23" font-weight="600" fill="#F4F6F8">Record it</text>
    <text x="22" y="98" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" fill="#7FC98C">#stk_sent</text>
    <text x="22" y="121" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" fill="#E58B82">#stk_error</text>
    <text x="22" y="144" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="19" fill="#B7BFC8">in your library</text>
  </g>

  <g fill="none" stroke="#F4A63A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.8">
    <path d="M309 145 l10 7 -10 7"/>
    <path d="M594 145 l10 7 -10 7"/>
    <path d="M879 145 l10 7 -10 7"/>
  </g>
</svg>
